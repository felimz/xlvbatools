name: Excel acceptance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      run_stress:
        description: Run the 50-operation and 25-workflow lifecycle stress tier
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-excel:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.XLVBA_EXCEL_CI_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, Excel]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Targeted Excel PR smoke
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: .venv\Scripts\python.exe scripts/test.py excel-smoke
      - name: Full scheduled or manual Excel acceptance
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: .venv\Scripts\python.exe scripts/test.py excel
      - name: Optional lifecycle stress
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_stress }}
        run: .venv\Scripts\python.exe scripts/test.py stress
