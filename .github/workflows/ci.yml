name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade --constraint requirements/security-constraints.txt pip setuptools wheel
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check src tests scripts
      - run: >-
          mypy --follow-imports=skip
          src/xlvbatools/project.py
          src/xlvbatools/execution.py
          src/xlvbatools/results.py
          src/xlvbatools/outputs.py
          src/xlvbatools/workflow.py
          src/xlvbatools/core/workflow.py
          src/xlvbatools/analysis/filtering.py
          src/xlvbatools/vba/differ.py
          src/xlvbatools/workbook/dumper.py
          src/xlvbatools/workbook/modifier.py
          src/xlvbatools/snapshots.py
          src/xlvbatools/cli

  offline:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade --constraint requirements/security-constraints.txt pip setuptools wheel
      - run: python -m pip install --requirement requirements-dev.txt
      - run: >-
          python -m pytest
          --cov=xlvbatools --cov-report=term-missing --cov-fail-under=60

  distribution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade --constraint requirements/security-constraints.txt pip setuptools wheel
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -m distribution
